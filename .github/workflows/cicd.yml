name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ==========================================
  # 1. INSTALL DEPENDENCIES
  # ==========================================

  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


  # ==========================================
  # 2. BUILD AND PUSH TO ECR
  # ==========================================

  build_and_push_ecr:
    needs: install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  # ==========================================
  # 3. UPLOAD SOURCE CODE TO S3
  # ==========================================

  upload_to_s3:
    needs: build_and_push_ecr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile tidak ditemukan!"
            exit 1
          fi

          echo "Dockerfile ditemukan!"

      - name: Create ZIP
        run: |
          zip -r flask-app.zip . \
            -x "flask-app.zip" \
            -x ".git/*" \
            -x ".github/*" \
            -x "venv/*" \
            -x ".venv/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".env"

      - name: Verify ZIP
        run: |
          unzip -l flask-app.zip

          unzip -Z1 flask-app.zip | grep -x "Dockerfile"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload ZIP to S3
        run: |
          aws s3 cp flask-app.zip \
            s3://${{ secrets.S3_BUCKET_NAME }}/flask-app.zip


  # ==========================================
  # 4. DEPLOY TO ELASTIC BEANSTALK
  # ==========================================

  deploy:
    needs: upload_to_s3
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create Application Version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --version-label "${GITHUB_SHA}" \
            --source-bundle \
              S3Bucket=${{ secrets.S3_BUCKET_NAME }},S3Key=flask-app.zip \
            --process

      - name: Deploy Application
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ secrets.EB_ENV_NAME }}" \
            --version-label "${GITHUB_SHA}"

      - name: Check Deployment
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names "${{ secrets.EB_ENV_NAME }}" \
            --query 'Environments[0].[Status,Health,CNAME]' \
            --output table